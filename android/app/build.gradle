plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"  // ✅ Flutter Gradle Plugin should be the first one.
    id "kotlin-android"
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics' // ✅ FlutterFire Configuration
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.1'

android {
    namespace "com.classic.userpetcare"
    compileSdk 35
    ndkVersion "27.0.12077973"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17 // ✅ Use Java 17 for better performance.
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'  // ✅ Updated from 1.8 to 17
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.classic.userpetcare"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()  // ✅ Ensure versionCode is an integer.
        versionName flutterVersionName
        multiDexEnabled true
    }



    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.debug  // ✅ Use correct signing config.
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24" // ✅ Updated to `jdk8`
    implementation platform('com.google.firebase:firebase-bom:33.4.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'phonepe.intentsdk.android.release:IntentSDK:2.4.2'
    implementation 'com.google.android.gms:play-services-wallet:19.4.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:1.2.2'
}
